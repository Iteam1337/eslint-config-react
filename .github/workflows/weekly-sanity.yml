name: Weekly sanity check

on:
  schedule:
    # 07:30 during CET and 08:30 during CEST in Europe/Stockholm.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-sanity-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  sanity:
    name: Install and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout config
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test